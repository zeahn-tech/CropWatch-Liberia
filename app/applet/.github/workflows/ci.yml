name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Type Check / Lint
        run: npm run lint

      - name: Run Tests
        run: npm test
        env:
          JWT_SECRET: "test-secret-for-ci"
          DAILY_AI_ANALYSES_LIMIT: "50"

      - name: Build
        run: npm run build
        env:
          JWT_SECRET: "test-secret-for-ci"
          DAILY_AI_ANALYSES_LIMIT: "50"
